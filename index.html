<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f5ef" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>ShelfLife | Reading tracker</title>
    <!-- Set the saved theme before the first paint. ThemeContext takes
         over once React loads; this only stops a light flash on reload. -->
    <script>
      try {
        const saved = localStorage.getItem('shelflife-theme');
        const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
